repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: stack-bound-doc
        name: stack-bound doc up to date
        entry: bash -c 'uv run python packages/settlrl-engine/tools/gen_stack_bound_doc.py && git diff --exit-code packages/settlrl-engine/docs/longest-road-stack-bound.html'
        language: system
        pass_filenames: false
        files: ^packages/settlrl-engine/(tools/gen_stack_bound_doc\.py|docs/longest-road-stack-bound\.html)$
      - id: mypy
        name: mypy
        entry: uv run mypy packages/settlrl-engine/src packages/settlrl-engine/tests packages/settlrl-agents/src packages/settlrl-agents/tests packages/settlrl-app/src packages/settlrl-game/src packages/settlrl-learn/src packages/settlrl-learn/tests/test_learn.py packages/settlrl-learn/tests/test_architectures.py packages/settlrl-learn/tests/test_training.py packages/settlrl-learn/tests/test_selfplay.py packages/settlrl-learn/tests/test_carry.py packages/settlrl-learn/tests/test_arena_elo.py packages/settlrl-learn/tests/test_bench.py packages/settlrl-learn/tests/test_elo.py packages/settlrl-learn/tests/benchmark/test_training_benchmark.py
        language: system
        pass_filenames: false
        always_run: true
      - id: mypy-experiments
        name: mypy (experiments)
        entry: bash mypy_experiments.sh
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: pytest
        entry: uv run pytest packages/settlrl-engine/tests/
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest-experiments-smoke
        name: pytest (experiment smoke, fast)
        # The `slow` smokes (JAX recompiles dominate) are CI-only; here we run
        # only the fast plumbing checks.
        entry: uv run pytest experiments/tests -m "not slow"
        language: system
        pass_filenames: false
        always_run: true

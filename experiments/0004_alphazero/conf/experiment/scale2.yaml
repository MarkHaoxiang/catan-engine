# @package _global_
defaults:
  - override /net: gnn
  - override /teacher: heuristic
  - override /search: scale
  - override /selfplay: scale
  - override /optim: scale
  - override /value_blend: scale
  - override /arena: scale
net:
  width: 96
  layers: 4
# scale2 ~10h: small's shape with the throughput wave's levers on -- persistent
# self-play (the lane pool; discard 72.8% -> ~0), an annealed opening
# temperature, and playout-cap randomization (deep policy targets at a
# fraction of the cost). batch=1024 wins the pinned hetero gauge (+14.8%,
# JOURNAL 2026-08-01); PCR/anneal are training-lever adoptions, not
# bench-measured.
n_iterations: 300
checkpoint_every: 50
selfplay:
  batch: 1024
  persistent: true
  checkpoint_pad: 512  # bounds the carry pad; clears the observed max pending (398 at B=512; settlrl-learn/CLAUDE.md)
  temperature_moves: 30
  pcr_full_prob: 0.25
  pcr_fast_sims: 16
search:
  num_simulations: 128
replay:
  buffer_max: 200000

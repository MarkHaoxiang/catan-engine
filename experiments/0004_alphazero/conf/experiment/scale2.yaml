# @package _global_
defaults:
  - override /net: gnn
  - override /teacher: heuristic
  - override /search: scale
  - override /selfplay: scale
  - override /optim: scale
  - override /value_blend: scale
  - override /arena: scale
net:
  width: 96
  layers: 4
# scale2 ~10h: small's shape with the throughput wave's levers on -- persistent
# self-play (the lane pool; discard 72.8% -> ~0), an annealed opening
# temperature, and playout-cap randomization (deep policy targets at a
# fraction of the cost). batch=512 and the with-persistence bench numbers come
# from the Step-0 re-sweep (JOURNAL 2026-07-28); PCR/anneal are training-lever
# adoptions, not bench-measured.
n_iterations: 300
checkpoint_every: 10
selfplay:
  batch: 512
  persistent: true
  temperature_moves: 30
  pcr_full_prob: 0.25
  pcr_fast_sims: 16
search:
  num_simulations: 128
replay:
  buffer_max: 200000

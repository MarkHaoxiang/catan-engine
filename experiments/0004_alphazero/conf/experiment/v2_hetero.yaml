# @package _global_
defaults:
  - override /net: gnn_hetero
  - override /teacher: heuristic
  - override /search: scale
  - override /selfplay: scale
  - override /optim: scale
  - override /value_blend: scale
  - override /arena: scale
net:
  width: 96
  layers: 4
  feature_version: 2
# v2_hetero: v2_base + the heterogeneous trunk (hexes as first-class nodes,
# `gn_hetero` preset -- vertex<->hex message passing each layer) swapped in
# for `gn_global`. The research plan called for HNHN degree normalization
# (the alpha/beta parameterization) on the vertex<->hex aggregation -- NOT
# implemented (graphnet.py's hetero aggregation is a plain segment-sum, no
# degree norm), so this arm ships as plain v2_base + gn_hetero. HNHN norm is
# a follow-up, not part of this study.
n_iterations: 300
checkpoint_every: 10
selfplay:
  batch: 512
  persistent: true
  temperature_moves: 30
  pcr_full_prob: 0.25
  pcr_fast_sims: 16
search:
  num_simulations: 128
replay:
  buffer_max: 200000

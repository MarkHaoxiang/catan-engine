games: 128          # ~= the eval batch (the evaluator overshoots to ~batch anyway)
every: 10           # three net rungs (az0/az1/az2, each every:1) make a full arena
                    # round several lookahead-grade matches; production presets
                    # override cadence to games=64/every=150 (~10% wall-share).
                    # Retuning this base cadence is gpu-day-checklist item 7.
batch: 128
sims: 24
considered: 16
opponents: [lookahead, random]
anchor_elos:
  lookahead: 0.0
  # calibrated 2026-07-29 (experiments/0001_bench_smoke calibrate, joint MLE
  # over random/greedy/lookahead/mcts/az0, n=4238 total; see JOURNAL.md).
  random: -1115.0
opponent_every:
  random: 5         # random has been 1.0 from iter ~9 on -- sample it, not every round
net_opponents:
  # the frozen az0 checkpoint as a mid-rung between random and lookahead.
  # elo calibrated 2026-07-29, see JOURNAL.md.
  az0_gnn96x4:
    elo: -58.0
    every: 1
  # scale2_long's finished checkpoint (2500 iters, first Stage-1 gate pass):
  # elo is its own final-gauntlet reading, gauntlet-calibrated 2026-07-30
  # at this same arena/search semantics scope (sims=24, considered=16,
  # chance_nodes=false, dev_chance=true, ordered=false) -- see JOURNAL.md.
  az1_gnn96x4:
    elo: 109.86
    every: 1
  # v2_hetero's finished checkpoint (2500 iters, second gate pass -- the
  # hypergraph trunk on v2 features): elo is its own final-gauntlet reading,
  # gauntlet-calibrated 2026-07-31 at this same scope -- see JOURNAL.md.
  az2_hetero96x4:
    elo: 186.76
    every: 1

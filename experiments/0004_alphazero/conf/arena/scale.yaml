games: 128          # ~= the eval batch (the evaluator overshoots to ~batch anyway)
every: 10           # production presets override cadence to games=64/every=150.
                    # The rungs below rotate at every:3 with staggered phases, so
                    # each round pools two anchors: lookahead plus one net rung.
                    # The final gauntlet neutralizes every schedule.
batch: 128
sims: 24
considered: 16
# lookahead only: `random` saturates at a 1.0 win rate within ~10 iterations, and
# a saturated anchor is continuity-corrected and nearly flat in the likelihood --
# it costs a round's games and moves the MLE by ~nothing. It stays in the
# round-robin of calibrate.py, where spanning the scale does inform the joint fit.
opponents: [lookahead]
anchor_elos:
  lookahead: 0.0
# The frozen rungs rotate (every: 3, phases 0/1/2 -- one per round). Do NOT
# reorder or remove entries: each rung's arena seed derives from its dict
# enumeration position (steps.NET_OPPONENT_SEED_BASE + k*10_000), so order
# changes silently re-seed the surviving rungs' paired game streams.
net_opponents:
  # the frozen az0 checkpoint as a mid-rung between random and lookahead.
  # elo calibrated 2026-07-29, see JOURNAL.md.
  az0_gnn96x4:
    elo: -58.0
    every: 3
    phase: 0
  # scale2_long's finished checkpoint (2500 iters, first Stage-1 gate pass):
  # elo is its own final-gauntlet reading, gauntlet-calibrated 2026-07-30
  # at this same arena/search semantics scope (sims=24, considered=16,
  # chance_nodes=false, dev_chance=true, ordered=false) -- see JOURNAL.md.
  az1_gnn96x4:
    elo: 109.86
    every: 3
    phase: 1
  # v2_hetero's finished checkpoint (2500 iters, second gate pass -- the
  # hypergraph trunk on v2 features): elo is its own final-gauntlet reading,
  # gauntlet-calibrated 2026-07-31 at this same scope -- see JOURNAL.md.
  az2_hetero96x4:
    elo: 186.76
    every: 3
    phase: 2

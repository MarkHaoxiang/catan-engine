games: 128          # ~= the eval batch (the evaluator overshoots to ~batch anyway)
every: 10           # arena was ~297s (lookahead+random); the az0 rung below adds
                    # one more lookahead-grade match every round (same batch/sims),
                    # roughly doubling that to ~590s; every 10 still keeps eval a
                    # bounded slice of wall-clock
batch: 128
sims: 24
considered: 16
opponents: [lookahead, random]
anchor_elos:
  lookahead: 0.0
  # calibrated 2026-07-29 (experiments/0001_bench_smoke calibrate, joint MLE
  # over random/greedy/lookahead/mcts/az0, n=4238 total; see JOURNAL.md). Was
  # -800.0 -- every historical arena_elo value shifts scale accordingly.
  random: -1115.0
opponent_every:
  random: 5         # random has been 1.0 from iter ~9 on -- sample it, not every round
net_opponents:
  # the frozen az0 checkpoint as a mid-rung between random and lookahead.
  # elo calibrated 2026-07-29 (was the provisional -100.0 from its 0.361 vs
  # lookahead alone; see JOURNAL.md).
  az0_gnn96x4:
    elo: -58.0
    every: 1

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  JAX_PLATFORMS: cpu
  # The cuda dependency group is default-on for dev machines; runners have no
  # GPU and shouldn't download the NVIDIA wheels.
  UV_NO_GROUP: cuda

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # XLA compilation cache (written by the test conftests); keyed loosely --
      # JAX validates entries itself, stale ones are just misses.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/jax-settlrl
          key: jax-settlrl-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: jax-settlrl-${{ runner.os }}-
      - run: uv sync --locked
      - run: uv run ruff check packages
      - run: uv run ruff format --check packages
      - run: >
          uv run mypy
          packages/settlrl-engine/src packages/settlrl-engine/tests
          packages/settlrl-search/src
          packages/settlrl-search/tests/test_ismcts.py packages/settlrl-search/tests/test_sample.py
          packages/settlrl-agents/src packages/settlrl-agents/tests
          packages/settlrl-app/src packages/settlrl-game/src
          packages/settlrl-learn/src
          packages/settlrl-learn/tests/test_learn.py packages/settlrl-learn/tests/test_architectures.py
          packages/settlrl-learn/tests/test_training.py packages/settlrl-learn/tests/test_selfplay.py
          packages/settlrl-learn/tests/test_carry.py packages/settlrl-learn/tests/test_arena_elo.py
          packages/settlrl-learn/tests/test_bench.py packages/settlrl-learn/tests/test_elo.py
          packages/settlrl-learn/tests/benchmark/test_training_benchmark.py
      - run: bash mypy_experiments.sh
      - run: uv run --package settlrl-engine pytest packages/settlrl-engine/tests
      - run: uv run --package settlrl-game pytest packages/settlrl-game
      - run: uv run --package settlrl-search pytest packages/settlrl-search/tests
      - run: uv run --package settlrl-app pytest packages/settlrl-app
      - run: uv run --package settlrl-agents pytest packages/settlrl-agents/tests
      - run: uv run --package settlrl-learn pytest packages/settlrl-learn/tests
      # Experiment tests (full, including `slow`): mostly config-composition
      # checks (seconds) plus one tiny end-to-end run per framework. `-n 2`
      # pins xdist to one JAX process per physical runner core (~4GB peak
      # each) rather than letting `auto` vary with the runner. The timeout is
      # well above the observed ~2 min cold-cache cost: a smoke that regresses
      # into a runaway budget fails here instead of eating the job's whole hour.
      - run: WANDB_MODE=disabled uv run pytest experiments/tests -n 2
        timeout-minutes: 10

  # The SPA build (tsc + vite). Catches type errors and broken/uncommitted
  # imports the Python suite can't see (the server runs no frontend code).
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/settlrl-app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/settlrl-app/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
